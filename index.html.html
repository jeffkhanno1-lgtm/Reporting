<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortune Academy | Enrollment & Progress Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ===== BRAND COLOURS: change these 5 lines to match Fortune Academy ===== */
:root{--navy:#0b2545;--gold:#c8a24a;--cream:#f7f4ec;--ink:#17202e;--line:#e0dac9;
--mute:#5f6b7a;--card:#fff;--ok:#1b7a3d;--okbg:#e2f3e7;--warn:#9a5f06;--warnbg:#fbeed2;--bad:#b3261e;--badbg:#fbe3e0}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif}
h2{margin:0 0 4px;font-size:1.3rem;color:var(--navy)}h3{margin:18px 0 6px;font-size:1rem;color:var(--navy)}
.sub{color:var(--mute);margin:0 0 14px;font-size:.9rem}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.hero{background:var(--navy);color:#fff;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;border-right:6px solid var(--gold)}
.hero .brand{font-size:2.4rem;line-height:1.1;margin:0 0 14px}.hero p{color:#c9d3e3;max-width:380px;margin:0}
.lf{display:flex;align-items:center;justify-content:center;padding:30px}
.lbox{width:100%;max-width:380px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--navy);border-radius:8px;overflow:hidden;margin:16px 0}
.seg button{border:0;background:#fff;padding:10px;cursor:pointer;color:var(--navy);font-weight:600}
.seg button.on{background:var(--navy);color:#fff}
@media(max-width:760px){.login{grid-template-columns:1fr}.hero{padding:30px 24px;border-right:0;border-bottom:6px solid var(--gold)}.hero .brand{font-size:1.7rem}}
/* shell */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:4px solid var(--gold);flex-wrap:wrap}
.top .brand{font-size:1.25rem;flex:1}.top small{color:#c9d3e3}
.tabs{display:flex;gap:2px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--gold);font-weight:700}
main{max-width:1100px;margin:auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font:700 1.7rem Georgia,serif;color:var(--navy)}.kpi span{color:var(--mute);font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c9c2ae;border-radius:6px;background:#fff;color:var(--ink)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:4px 10px;font-size:.82rem}.btn.red{background:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:end}.bar>*{flex:1;min-width:140px}.bar .btn{flex:0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:.82rem;background:#faf8f2}.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.prog{height:8px;background:#e8e3d3;border-radius:6px;overflow:hidden;min-width:70px}.prog i{display:block;height:100%;background:var(--gold)}
.steps{display:flex;margin:14px 0}.step{flex:1;text-align:center;padding-top:24px;position:relative;color:var(--mute);font-size:.85rem}
.step:before{content:"";position:absolute;top:4px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--line)}
.step:after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}.step:first-child:after{display:none}
.step:before{z-index:1}.step.d{color:var(--navy);font-weight:700}.step.d:before,.step.d:after{background:var(--gold)}
.kv{display:flex;flex-wrap:wrap;gap:6px 30px}.kv span{display:block;color:var(--mute);font-size:.8rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:50;display:none;max-width:90vw}
.toast.err{background:var(--bad)}
#modal{position:fixed;inset:0;background:#0b254588;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:40}
#modal .card{max-width:760px;width:100%;margin:0}
td input{width:90px;padding:5px}.empty{color:var(--mute);padding:8px 0}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast" class="toast" role="status"></div>
<script>
/* ===== 1. PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) ===== */
const SUPABASE_URL = "sb_publishable_nhDUxp3aQimbZaY0oAEmUg_EGPKUQtY";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5dGZ6Ym5zeXJ0Y211d3F6c2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MTU5MTYsImV4cCI6MjEwODE5MTkxNn0.wm6ORBvZPmPSJ7cklruyyDWJfxkLAgwI1paPdPUlzrY";
/* ======================================================================= */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STATUSES=["Registered","Processing","Enrolled","On hold","Completed","Withdrawn"], STEPS=["Registered","Processing","Enrolled","Completed"], PASS=50;
let S={user:null,prof:null,tab:"report",sel:null,mode:"partner",f:{q:"",prog:"",st:""}}, D={programs:[],students:[],swaps:[],partners:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"–";
const letter=p=>p>=80?"A":p>=70?"B":p>=60?"C":p>=PASS?"D":"F";
const isStaff=()=>S.prof&&S.prof.role==="staff";
const bcls=s=>["Enrolled","Completed","Approved"].includes(s)?"ok":["Withdrawn","Declined"].includes(s)?"bad":"warn";
const badge=s=>`<span class="badge ${bcls(s)}">${esc(s)}</span>`;
function toast(m,err){const t=$("toast");t.textContent=m;t.className="toast"+(err?" err":"");t.style.display="block";clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",3500)}
const fail=e=>{if(e){toast(e.message||String(e),1);return true}return false};
const pname=id=>(D.partners.find(p=>p.id===id)||{}).org||"–";
const progName=id=>(D.programs.find(p=>p.id===id)||{}).name||"–";
const opts=(arr,sel,ph)=>(ph?`<option value="">${ph}</option>`:"")+arr.map(a=>{const v=a.id??a,l=a.name??a;return`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`}).join("");

/* ---------- data ---------- */
async function load(){
  const [p,s,w]=await Promise.all([
    sb.from("programs").select("*,courses(*,assessments(*))").order("name"),
    sb.from("students").select("*,grades(*)").order("created_at",{ascending:false}),
    sb.from("swap_requests").select("*,students(name,dtc_id)").order("created_at",{ascending:false})]);
  if(fail(p.error)||fail(s.error)||fail(w.error))return;
  D.programs=p.data;D.students=s.data;D.swaps=w.data;
  D.partners=isStaff()?((await sb.from("profiles").select("*").order("org")).data||[]):[S.prof];
}
function calc(st){
  const P=D.programs.find(p=>p.id===st.program_id);if(!P)return{P:null,courses:[],done:0,total:0,avg:null};
  const gm={};(st.grades||[]).forEach(g=>gm[g.assessment_id]=g.score);
  let done=0,total=0,sum=0,n=0;
  const courses=(P.courses||[]).map(c=>{let cw=0,cs=0;
    const rows=(c.assessments||[]).map(a=>{total++;const v=gm[a.id],has=v!==undefined&&v!==null;if(has){done++;cw+=+a.weight;cs+=a.weight*v/100}return{a,v:has?+v:null}});
    const pct=cw?cs/cw*100:null;if(cw){sum+=pct;n++}return{c,rows,pct}});
  return{P,courses,done,total,avg:n?sum/n:null};
}

/* ---------- auth ---------- */
function loginView(){
  return`<div class="login"><div class="hero"><h1 class="brand">Fortune Academy</h1><p>Enrollment and student progress reporting for our team and partners.</p></div>
  <div class="lf"><form class="lbox" id="lf"><h2>Sign in</h2><p class="sub">Choose your account type.</p>
  <div class="seg"><button type="button" data-a="mode" data-m="partner" class="${S.mode==="partner"?"on":""}">Partner login</button><button type="button" data-a="mode" data-m="staff" class="${S.mode==="staff"?"on":""}">Staff login</button></div>
  <label for="em">Email</label><input id="em" type="email" required autocomplete="username"><br><br>
  <label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"><br><br>
  <button class="btn" style="width:100%">Sign in as ${S.mode}</button>
  <p class="sub" style="margin-top:12px">No account yet or forgot your password? Contact the Fortune Academy team.</p></form></div></div>`;
}
async function signIn(e){
  e.preventDefault();
  const {data,error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(fail(error))return;
  await start(data.user,true);
}
async function start(user,check){
  const {data:prof,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
  if(fail(error)){await sb.auth.signOut();return}
  if(check&&prof.role!==S.mode){await sb.auth.signOut();toast(`This account is a ${prof.role} account. Use the ${prof.role} login.`,1);return}
  S.user=user;S.prof=prof;S.mode=prof.role;S.tab="report";S.sel=null;await load();render();
}

/* ---------- shell ---------- */
function render(){
  if(!S.user){$("app").innerHTML=loginView();$("lf").onsubmit=signIn;return}
  const tabs=isStaff()?[["report","Report"],["students","Students"],["register","Register student"],["programs","Programs"],["swaps","Swap requests"],["partners","Partners"]]
    :[["report","My report"],["register","Register student"],["swap","Request a swap"]];
  const v={report:reportView,students:studentsView,register:registerView,programs:programsView,swaps:swapsView,partners:partnersView,swap:swapFormView}[S.tab];
  $("app").innerHTML=`<div class="top"><span class="brand">Fortune Academy</span><small>${esc(S.prof.org||S.prof.email)} · ${S.prof.role}</small><button class="btn gold sm" data-a="out">Sign out</button></div>
  <div class="tabs">${tabs.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${S.tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>
  <main>${S.sel&&S.tab==="report"?detailView(D.students.find(s=>s.id===S.sel)):v()}</main>`;
  if($("rt"))fillTable();
}

/* ---------- report ---------- */
function filtered(){const f=S.f,q=f.q.toLowerCase();
  return D.students.filter(s=>(!q||[s.name,s.dtc_id,s.email].some(x=>(x||"").toLowerCase().includes(q)))&&(!f.prog||s.program_id===f.prog)&&(!f.st||s.status===f.st))}
function reportView(){
  const all=D.students,av=all.map(s=>calc(s).avg).filter(x=>x!==null),cnt=st=>all.filter(s=>st.includes(s.status)).length;
  const byProg=D.programs.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(p.start_date)} – ${fmt(p.end_date)}</td><td>${all.filter(s=>s.program_id===p.id).length}</td><td>${all.filter(s=>s.program_id===p.id&&s.status==="Enrolled").length}</td></tr>`).join("");
  return`<div class="kpis"><div class="kpi"><b>${all.length}</b><span>Students registered</span></div><div class="kpi"><b>${cnt(["Registered","Processing"])}</b><span>Awaiting processing</span></div>
  <div class="kpi"><b>${cnt(["Enrolled"])}</b><span>Enrolled</span></div><div class="kpi"><b>${cnt(["Completed"])}</b><span>Completed</span></div>
  <div class="kpi"><b>${av.length?(av.reduce((a,b)=>a+b,0)/av.length).toFixed(1)+"%":"–"}</b><span>Average grade</span></div></div>
  <div class="card"><h2>Student report</h2><p class="sub">Registration status, progress and grades for each student. Select a student for the full breakdown.</p>
  <div class="bar"><div><label for="fq">Search</label><input id="fq" value="${esc(S.f.q)}" placeholder="Name, DTC ID or email"></div>
  <div><label for="fp">Program</label><select id="fp">${opts(D.programs,S.f.prog,"All programs")}</select></div>
  <div><label for="fs">Status</label><select id="fs">${opts(STATUSES,S.f.st,"All statuses")}</select></div>
  <button class="btn sec" data-a="csv">Export CSV</button></div><div id="rt"></div></div>
  <div class="card"><h2>By program</h2><div class="tw"><table><tr><th>Program</th><th>Dates</th><th>Registered</th><th>Enrolled</th></tr>${byProg||'<tr><td class="empty">No programs yet.</td></tr>'}</table></div></div>`;
}
function fillTable(){
  const rows=filtered();
  $("rt").innerHTML=rows.length?`<div class="tw"><table><tr><th>Student</th><th>DTC ID</th>${isStaff()?"<th>Partner</th>":""}<th>Program</th><th>Status</th><th>Progress</th><th>Average</th><th></th></tr>${rows.map(s=>{const c=calc(s),pc=c.total?c.done/c.total*100:0;
    return`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.email)}</small></td><td>${esc(s.dtc_id)}</td>${isStaff()?`<td>${esc(pname(s.partner_id))}</td>`:""}<td>${esc(progName(s.program_id))}</td><td>${badge(s.status)}</td>
    <td><div class="prog"><i style="width:${pc}%"></i></div><small>${c.done}/${c.total} graded</small></td><td>${c.avg===null?"–":c.avg.toFixed(1)+"% ("+letter(c.avg)+")"}</td>
    <td><button class="btn sm sec" data-a="view" data-id="${s.id}">View</button></td></tr>`}).join("")}</table></div>`:`<p class="empty">No students match. Use "Register student" to add one.</p>`;
  for(const[i,k]of[["fq","q"],["fp","prog"],["fs","st"]])$(i).oninput=e=>{S.f[k]=e.target.value;fillTable()};
}
function detailView(s){
  if(!s)return"";const c=calc(s),i=STEPS.indexOf(s.status);
  const sw=D.swaps.filter(x=>x.student_id===s.id);
  return`<button class="btn sec sm" data-a="back">Back to report</button><br><br><div class="card"><h2>${esc(s.name)}</h2><p class="sub">DTC ID ${esc(s.dtc_id)} · ${esc(s.email)} · ${esc(s.phone)}</p>
  <div class="steps">${STEPS.map((t,j)=>`<div class="step ${i>=j?"d":""}">${t}</div>`).join("")}</div>
  <p>Enrollment status: ${badge(s.status)} ${s.status==="Registered"?"We have received this registration. It has not been processed yet.":s.status==="Processing"?"Being processed by our team.":""}</p>
  <div class="kv"><div><span>Program</span>${esc(progName(s.program_id))}</div><div><span>Start date</span>${fmt(c.P?.start_date)}</div><div><span>End date</span>${fmt(c.P?.end_date)}</div>
  <div><span>Registered on</span>${fmt(s.created_at.slice(0,10))}</div><div><span>Address</span>${esc(s.address)}</div></div>${s.notes?`<p><b>Notes:</b> ${esc(s.notes)}</p>`:""}</div>
  <div class="card"><h2>Progress and grades</h2><p class="sub">${c.done} of ${c.total} assessments graded · Overall ${c.avg===null?"no grades yet":c.avg.toFixed(1)+"% (grade "+letter(c.avg)+")"}</p>
  ${c.courses.map(x=>`<h3>${esc(x.c.name)} ${x.pct===null?"":`<span class="badge ${x.pct>=PASS?"ok":"bad"}">${x.pct.toFixed(1)}% · ${letter(x.pct)}</span>`}</h3>
  <div class="tw"><table><tr><th>Assessment</th><th>Weight</th><th>Score</th><th>Grade</th></tr>${x.rows.map(r=>`<tr><td>${esc(r.a.name)}</td><td>${r.a.weight}%</td><td>${r.v===null?"Pending":r.v+"%"}</td><td>${r.v===null?"–":letter(r.v)}</td></tr>`).join("")}</table></div>`).join("")||'<p class="empty">No courses set up for this program yet.</p>'}</div>
  ${sw.length?`<div class="card"><h2>Swap requests</h2><div class="tw"><table><tr><th>Replacement</th><th>Reason</th><th>Status</th><th>Staff note</th></tr>${sw.map(x=>`<tr><td>${esc(x.new_name)} (${esc(x.new_dtc)})</td><td>${esc(x.reason)}</td><td>${badge(x.status)}</td><td>${esc(x.staff_note)}</td></tr>`).join("")}</table></div></div>`:""}`;
}
function csv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,rows=[["Name","DTC ID","Email","Phone","Address","Partner","Program","Start","End","Status","Graded","Total assessments","Average %"]];
  filtered().forEach(s=>{const c=calc(s);rows.push([s.name,s.dtc_id,s.email,s.phone,s.address,pname(s.partner_id),progName(s.program_id),c.P?.start_date,c.P?.end_date,s.status,c.done,c.total,c.avg===null?"":c.avg.toFixed(1)])});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="fortune-academy-report.csv";a.click();
}

/* ---------- register ---------- */
function registerView(){
  return`<div class="card"><h2>Register a student</h2><p class="sub">Add the student's details and choose a program. You can follow the status under the report.</p>
  <form id="rf" class="grid"><div><label>Full name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div>
  <div><label>Phone</label><input name="phone" type="tel" required></div><div><label>DTC ID</label><input name="dtc_id" required></div>
  <div class="full"><label>Address</label><textarea name="address" rows="2" required></textarea></div>
  <div class="${isStaff()?"":"full"}"><label>Program</label><select name="program_id" required>${opts(D.programs,"","Select a program")}</select></div>
  ${isStaff()?`<div><label>Partner</label><select name="partner_id" required>${opts(D.partners.map(p=>({id:p.id,name:p.org||p.email})),"","Select a partner")}</select></div>`:""}
  <div class="full"><button class="btn">Register student</button></div></form></div>`;
}
async function register(e){
  e.preventDefault();const r=Object.fromEntries(new FormData(e.target));
  r.partner_id=r.partner_id||S.user.id;r.email=r.email.toLowerCase();
  const{error}=await sb.from("students").insert(r);
  if(error)return toast(error.code==="23505"?"That DTC ID is already registered.":error.message,1);
  await load();S.tab="report";render();toast("Student registered.");
}

/* ---------- swap (partner) ---------- */
function swapFormView(){
  return`<div class="card"><h2>Request a student swap</h2><p class="sub">Ask us to replace one of your students with another. Our team will review it.</p>
  <form id="sf" class="grid"><div class="full"><label>Student to replace</label><select name="student_id" required>${opts(D.students.map(s=>({id:s.id,name:`${s.name} (${s.dtc_id})`})),"","Select a student")}</select></div>
  <div><label>Replacement name</label><input name="new_name" required></div><div><label>Replacement DTC ID</label><input name="new_dtc" required></div>
  <div class="full"><label>Reason</label><textarea name="reason" rows="3" required></textarea></div><div class="full"><button class="btn">Send request</button></div></form></div>
  <div class="card"><h2>Your requests</h2>${swapTable(false)}</div>`;
}
async function swapSend(e){
  e.preventDefault();const r=Object.fromEntries(new FormData(e.target));r.partner_id=S.user.id;
  const{error}=await sb.from("swap_requests").insert(r);if(fail(error))return;await load();render();toast("Swap request sent.");
}
function swapTable(staff){
  return D.swaps.length?`<div class="tw"><table><tr><th>Replace</th><th>With</th><th>Reason</th><th>Status</th><th>Staff note</th>${staff?"<th></th>":""}</tr>${D.swaps.map(x=>`<tr><td>${esc(x.students?.name)} (${esc(x.students?.dtc_id)})${staff?`<br><small>${esc(pname(x.partner_id))}</small>`:""}</td><td>${esc(x.new_name)} (${esc(x.new_dtc)})</td><td>${esc(x.reason)}</td><td>${badge(x.status)}</td><td>${esc(x.staff_note)}</td>
  ${staff?`<td>${x.status==="Pending"?`<button class="btn sm" data-a="swapok" data-id="${x.id}">Approve</button> <button class="btn sm sec" data-a="swapno" data-id="${x.id}">Decline</button>`:""}</td>`:""}</tr>`).join("")}</table></div>`:`<p class="empty">No swap requests yet.</p>`;
}

/* ---------- staff views ---------- */
function studentsView(){
  return`<div class="card"><h2>Manage students</h2><p class="sub">Update status, details and assessment grades for any student.</p>
  <div class="tw"><table><tr><th>Student</th><th>DTC ID</th><th>Partner</th><th>Program</th><th>Status</th><th></th></tr>${D.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.dtc_id)}</td><td>${esc(pname(s.partner_id))}</td><td>${esc(progName(s.program_id))}</td>
  <td><select data-a="qs" data-id="${s.id}" aria-label="Status">${opts(STATUSES,s.status)}</select></td><td><button class="btn sm" data-a="edit" data-id="${s.id}">Edit and grade</button></td></tr>`).join("")||'<tr><td class="empty">No students yet.</td></tr>'}</table></div></div>`;
}
function editModal(id){
  const s=D.students.find(x=>x.id===id),c=calc(s),f=(k,l,t="text")=>`<div><label>${l}</label><input name="${k}" type="${t}" value="${esc(s[k])}"></div>`;
  $("modal").innerHTML=`<form class="card" id="ef"><h2>Edit ${esc(s.name)}</h2><div class="grid">${f("name","Name")}${f("email","Email","email")}${f("phone","Phone")}${f("dtc_id","DTC ID")}
  <div class="full"><label>Address</label><input name="address" value="${esc(s.address)}"></div>
  <div><label>Program</label><select name="program_id">${opts(D.programs,s.program_id)}</select></div><div><label>Status</label><select name="status">${opts(STATUSES,s.status)}</select></div>
  <div class="full"><label>Notes</label><textarea name="notes" rows="2">${esc(s.notes)}</textarea></div></div>
  <h3>Assessment grades (score out of 100, leave blank if not marked)</h3>
  ${c.courses.map(x=>`<b>${esc(x.c.name)}</b><div class="tw"><table>${x.rows.map(r=>`<tr><td>${esc(r.a.name)} (${r.a.weight}%)</td><td><input type="number" min="0" max="100" step="0.1" data-g="${r.a.id}" value="${r.v??""}" aria-label="${esc(r.a.name)} score"></td></tr>`).join("")}</table></div>`).join("")||'<p class="empty">Save to load the new program\'s assessments.</p>'}
  <br><button class="btn">Save changes</button> <button type="button" class="btn sec" data-a="close">Cancel</button> <button type="button" class="btn red" data-a="del" data-id="${id}" style="float:right">Delete student</button></form>`;
  $("modal").style.display="flex";
  $("ef").onsubmit=async e=>{e.preventDefault();
    const r=Object.fromEntries([...new FormData(e.target)]);
    if(fail((await sb.from("students").update(r).eq("id",id)).error))return;
    const ups=[],dels=[];e.target.querySelectorAll("[data-g]").forEach(i=>i.value===""?dels.push(i.dataset.g):ups.push({student_id:id,assessment_id:i.dataset.g,score:+i.value}));
    if(ups.length&&fail((await sb.from("grades").upsert(ups,{onConflict:"student_id,assessment_id"})).error))return;
    if(dels.length&&fail((await sb.from("grades").delete().eq("student_id",id).in("assessment_id",dels)).error))return;
    $("modal").style.display="none";await load();render();toast("Saved.");};
}
function programsView(){
  return`<div class="card"><h2>Programs, courses and assessments</h2><p class="sub">These drive the dates, courses and grading that students and partners see.</p><button class="btn gold" data-a="padd">Add program</button></div>
  ${D.programs.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><p class="sub">${fmt(p.start_date)} to ${fmt(p.end_date)}</p>
  <button class="btn sm" data-a="pedit" data-id="${p.id}">Edit program</button> <button class="btn sm sec" data-a="cadd" data-id="${p.id}">Add course</button> <button class="btn sm red" data-a="pdel" data-id="${p.id}">Delete</button>
  ${(p.courses||[]).map(c=>`<h3>${esc(c.name)} <button class="btn sm sec" data-a="cedit" data-id="${c.id}">Rename</button> <button class="btn sm sec" data-a="aadd" data-id="${c.id}">Add assessment</button> <button class="btn sm red" data-a="cdel" data-id="${c.id}">Delete</button></h3>
  <div class="tw"><table>${(c.assessments||[]).map(a=>`<tr><td>${esc(a.name)}</td><td>${a.weight}%</td><td><button class="btn sm sec" data-a="aedit" data-id="${a.id}">Edit</button> <button class="btn sm red" data-a="adel" data-id="${a.id}">Delete</button></td></tr>`).join("")||'<tr><td class="empty">No assessments yet.</td></tr>'}</table></div>`).join("")}</div>`).join("")}`;
}
function swapsView(){return`<div class="card"><h2>Swap requests</h2><p class="sub">Approving a swap replaces the student's name and DTC ID with the replacement's details.</p>${swapTable(true)}</div>`}
function partnersView(){
  return`<div class="card"><h2>Partners and team accounts</h2><p class="sub">New logins are created in Supabase (Authentication > Users). They appear here as partners, and you can rename them or make them staff.</p>
  <div class="tw"><table><tr><th>Organisation</th><th>Email</th><th>Role</th><th>Students</th><th></th></tr>${D.partners.map(p=>`<tr><td>${esc(p.org)}</td><td>${esc(p.email)}</td><td>${badge(p.role==="staff"?"Enrolled":"Registered").replace(/>[^<]*</,">"+p.role+"<")}</td><td>${D.students.filter(s=>s.partner_id===p.id).length}</td>
  <td><button class="btn sm sec" data-a="porg" data-id="${p.id}">Rename</button> <button class="btn sm sec" data-a="prole" data-id="${p.id}">Make ${p.role==="staff"?"partner":"staff"}</button></td></tr>`).join("")}</table></div></div>`;
}

/* ---------- actions ---------- */
const num=v=>v!==null&&v!==""&&!isNaN(v)?+v:null;
const run=async(q,msg)=>{if(fail((await q).error))return;await load();render();if(msg)toast(msg)};
const A={
  mode:d=>{S.mode=d.m;render()},
  out:async()=>{await sb.auth.signOut();S.user=S.prof=null;render()},
  tab:d=>{S.tab=d.t;S.sel=null;render()},view:d=>{S.sel=d.id;render()},back:()=>{S.sel=null;render()},csv,
  close:()=>$("modal").style.display="none",edit:d=>editModal(d.id),
  del:async d=>{if(confirm("Delete this student and all their grades?")){await run(sb.from("students").delete().eq("id",d.id),"Deleted.");$("modal").style.display="none"}},
  padd:()=>{const n=prompt("Program name");if(!n)return;const s=prompt("Start date (YYYY-MM-DD)"),e=prompt("End date (YYYY-MM-DD)");run(sb.from("programs").insert({name:n,start_date:s||null,end_date:e||null}),"Program added.")},
  pedit:d=>{const p=D.programs.find(x=>x.id===d.id),n=prompt("Program name",p.name);if(!n)return;const s=prompt("Start date (YYYY-MM-DD)",p.start_date||""),e=prompt("End date (YYYY-MM-DD)",p.end_date||"");run(sb.from("programs").update({name:n,start_date:s||null,end_date:e||null}).eq("id",d.id),"Updated.")},
  pdel:d=>confirm("Delete this program, its courses and assessments?")&&run(sb.from("programs").delete().eq("id",d.id)),
  cadd:d=>{const n=prompt("Course name");n&&run(sb.from("courses").insert({program_id:d.id,name:n}))},
  cedit:d=>{const n=prompt("Course name");n&&run(sb.from("courses").update({name:n}).eq("id",d.id))},
  cdel:d=>confirm("Delete this course and its assessments?")&&run(sb.from("courses").delete().eq("id",d.id)),
  aadd:d=>{const n=prompt("Assessment name");if(!n)return;const w=num(prompt("Weight % of the course (e.g. 40)","100"));w!==null&&run(sb.from("assessments").insert({course_id:d.id,name:n,weight:w}))},
  aedit:d=>{const a=D.programs.flatMap(p=>p.courses).flatMap(c=>c.assessments).find(x=>x.id===d.id),n=prompt("Assessment name",a.name);if(!n)return;const w=num(prompt("Weight %",a.weight));w!==null&&run(sb.from("assessments").update({name:n,weight:w}).eq("id",d.id))},
  adel:d=>confirm("Delete this assessment and its grades?")&&run(sb.from("assessments").delete().eq("id",d.id)),
  swapok:async d=>{const x=D.swaps.find(y=>y.id===d.id),note=prompt("Note for the partner (optional)")??"";
    if(fail((await sb.from("students").update({name:x.new_name,dtc_id:x.new_dtc}).eq("id",x.student_id)).error))return;
    run(sb.from("swap_requests").update({status:"Approved",staff_note:note}).eq("id",d.id),"Swap approved and applied.")},
  swapno:d=>{const note=prompt("Reason for declining");note!==null&&run(sb.from("swap_requests").update({status:"Declined",staff_note:note}).eq("id",d.id),"Declined.")},
  porg:d=>{const n=prompt("Organisation name");n&&run(sb.from("profiles").update({org:n}).eq("id",d.id))},
  prole:d=>{const p=D.partners.find(x=>x.id===d.id),r=p.role==="staff"?"partner":"staff";confirm(`Make ${p.email} a ${r}?`)&&run(sb.from("profiles").update({role:r}).eq("id",d.id))}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&b.tagName!=="SELECT")A[b.dataset.a]?.(b.dataset)});
document.addEventListener("change",e=>{if(e.target.dataset.a==="qs")run(sb.from("students").update({status:e.target.value}).eq("id",e.target.dataset.id),"Status updated.")});
document.addEventListener("submit",e=>{if(e.target.id==="rf")register(e);if(e.target.id==="sf")swapSend(e)});

/* ---------- boot ---------- */
(async()=>{const{data}=await sb.auth.getSession();if(data.session)await start(data.session.user,false);else render()})();
</script>
</body>
</html>
