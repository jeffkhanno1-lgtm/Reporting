<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune Academy – Partner Reporting Portal</title>
<style>
:root{--navy:#0b1f3a;--navy2:#13305a;--gold:#c9a227;--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mut:#6b7587;--line:#e1e6ee;--ok:#1f9d63;--warn:#d98a00;--bad:#c93b3b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.logo{font-weight:800;letter-spacing:.5px;font-size:20px}.logo span{color:var(--gold)}
header small{color:#c8d2e3;margin-right:12px}
main{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
h2{margin:0 0 14px;color:var(--navy)}h3{margin:0 0 10px;color:var(--navy)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--navy)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.btn{background:var(--gold);color:var(--navy);border:0;padding:11px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.dark{background:var(--navy);color:#fff}.btn.sm{padding:6px 12px;margin:0;font-size:13px}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.wrap{overflow-x:auto}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#e8edf5;color:var(--navy)}
.b-Submitted{background:#fff3d6;color:#9a6a00}.b-Processed{background:#dfeafc;color:#1a4fa0}.b-Enrolled,.b-Completed,.b-Approved,.b-Passed{background:#dcf5e8;color:var(--ok)}.b-Rejected,.b-Failed,.b-Withdrawn{background:#fbe0e0;color:var(--bad)}
.steps{display:flex;gap:0;margin:8px 0}.step{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:22px}
.step:before{content:"";position:absolute;top:4px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--line)}
.step.done{color:var(--navy);font-weight:700}.step.done:before{background:var(--gold)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.login{max-width:420px;margin:60px auto}.hide{display:none}
.note{background:#fff8e1;border:1px solid #f0dc9a;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:8px}.ok{color:var(--ok);font-size:13px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(11,31,58,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal .card{max-width:820px;width:100%}
.mut{color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="logo">FORTUNE <span>ACADEMY</span></div><div><small id="who"></small><button class="btn sm ghost hide" id="out" onclick="logout()">Log out</button></div></header>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* ============ 1. SETTINGS – EDIT THIS PART ============ */
const FIREBASE_CONFIG = null; // paste your Firebase config object here to go live (see guide). null = demo mode
const ADMIN_EMAILS = ["admin@fortuneacademy.com"]; // team emails who get the backend
const PROGRAMS = { // name -> courses and their assessments
 "Digital Marketing Diploma":{courses:{"SEO Fundamentals":["Quiz 1","Assignment 1"],"Social Media Strategy":["Project","Final Exam"]}},
 "Business Management Certificate":{courses:{"Management Basics":["Quiz 1","Case Study"],"Finance for Managers":["Assignment 1","Final Exam"]}},
 "IT Support Program":{courses:{"Networking 101":["Lab 1","Quiz 1"],"Operating Systems":["Lab 2","Final Exam"]}}
};
const STATUSES=["Submitted","Processed","Enrolled","Completed","Withdrawn","Rejected"];
/* ======================================================== */

const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10);
let user=null, isAdmin=false, tab="", store;

/* ---------- Data layer: Firebase (live) or localStorage (demo) ---------- */
if(FIREBASE_CONFIG){
 firebase.initializeApp(FIREBASE_CONFIG); const fdb=firebase.firestore(), fauth=firebase.auth();
 store={
  async list(c){const q=isAdmin?fdb.collection(c):fdb.collection(c).where("partnerUid","==",user.uid);const s=await q.get();return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||"").localeCompare(a.created||""))},
  async add(c,o){await fdb.collection(c).doc(o.id).set(o)},
  async upd(c,id,o){await fdb.collection(c).doc(id).update(o)},
  async login(e,p){const r=await fauth.signInWithEmailAndPassword(e,p);return r.user},
  async signup(e,p){const r=await fauth.createUserWithEmailAndPassword(e,p);return r.user},
  async logout(){await fauth.signOut()},
  async reset(e){await fauth.sendPasswordResetEmail(e)}
 };
}else{
 const g=c=>JSON.parse(localStorage.getItem("fa_"+c)||"[]"), s=(c,v)=>localStorage.setItem("fa_"+c,JSON.stringify(v));
 store={
  async list(c){return g(c).filter(x=>isAdmin||x.partnerUid===user.uid).sort((a,b)=>(b.created||"").localeCompare(a.created||""))},
  async add(c,o){const a=g(c);a.push(o);s(c,a)},
  async upd(c,id,o){s(c,g(c).map(x=>x.id===id?{...x,...o}:x))},
  async login(e){return{uid:"u_"+e,email:e}},async signup(e){return{uid:"u_"+e,email:e}},async logout(){},async reset(){}
 };
}

/* ---------- Login ---------- */
function loginView(){
 $("#out").classList.add("hide");$("#who").textContent="";
 $("#app").innerHTML=`<div class="card login"><h2>Sign in</h2>
 <div class="tabs"><button id="tp" class="on" onclick="setRole('p')">Partner login</button><button id="ta" onclick="setRole('a')">Fortune Academy team</button></div>
 <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <button class="btn" onclick="doLogin()">Log in</button>
 <button class="btn ghost" id="su" onclick="doSignup()" style="margin-left:6px">Create partner account</button>
 <div><a href="#" onclick="doReset();return false" class="mut">Forgot password?</a></div><div id="msg"></div>
 ${FIREBASE_CONFIG?"":`<div class="note"><b>Demo mode</b> – data is saved only in this browser. Use any email/password. Team login: <b>${esc(ADMIN_EMAILS[0])}</b>. Follow the guide to go live.</div>`}</div>`;
}
let role="p";function setRole(r){role=r;$("#tp").classList.toggle("on",r=="p");$("#ta").classList.toggle("on",r=="a");$("#su").classList.toggle("hide",r=="a")}
async function enter(u){
 user=u;isAdmin=ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
 if(role=="a"&&!isAdmin){await store.logout();throw Error("This account is not a team account.")}
 if(role=="p"&&isAdmin){role="a"}
 $("#who").textContent=(isAdmin?"Team · ":"Partner · ")+u.email;$("#out").classList.remove("hide");
 tab=isAdmin?"students":"register";render();
}
async function doLogin(){try{if(!$("#pw").value&&FIREBASE_CONFIG)throw Error("Enter password");await enter(await store.login($("#em").value.trim(),$("#pw").value))}catch(e){$("#msg").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function doSignup(){try{if($("#pw").value.length<6)throw Error("Password must be 6+ characters");await enter(await store.signup($("#em").value.trim(),$("#pw").value))}catch(e){$("#msg").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function doReset(){try{await store.reset($("#em").value.trim());$("#msg").innerHTML=`<div class="ok">If the account exists, a reset email was sent.</div>`}catch(e){$("#msg").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function logout(){await store.logout();user=null;loginView()}

/* ---------- Helpers ---------- */
const grade=(s,m)=>{if(s===""||s==null)return"";const p=s/m*100;return p>=85?"A":p>=70?"B":p>=55?"C":p>=40?"D":"F"};
const badge=s=>`<span class="badge b-${esc(s)}">${esc(s)}</span>`;
function progress(st){const a=st.assessments||[];const d=a.filter(x=>x.score!==""&&x.score!=null).length;return a.length?Math.round(d/a.length*100):0}
function stepper(s){const o=["Submitted","Processed","Enrolled"];const i=o.indexOf(s);return`<div class="steps">${o.map((x,k)=>`<div class="step ${k<=i?"done":""}">${x}</div>`).join("")}</div>`}
const tabsHtml=l=>`<div class="tabs">${l.map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${n}</button>`).join("")}</div>`;

/* ---------- Render ---------- */
async function render(){
 const students=await store.list("students"),swaps=await store.list("swaps");
 const pend=swaps.filter(x=>x.status=="Pending").length;
 let h="";
 if(!isAdmin){
  h+=tabsHtml([["register","Register student"],["mine","My registrations"],["progress","Student progress"],["swap","Swap request"]]);
  h+=tab=="register"?registerView():tab=="mine"?mineView(students):tab=="progress"?progressView(students):swapView(students,swaps);
 }else{
  h+=tabsHtml([["students","All students"],["swaps","Swap requests"+(pend?` (${pend})`:"")]]);
  h+=tab=="students"?adminStudents(students):adminSwaps(swaps);
 }
 $("#app").innerHTML=h;window._s=students;window._w=swaps;
}

function registerView(){return`<div class="card"><h2>Register a student</h2><div class="grid">
 <div><label>Full name</label><input id="r_name"></div><div><label>Email</label><input id="r_email" type="email"></div>
 <div><label>Phone</label><input id="r_phone"></div><div><label>DTC ID</label><input id="r_dtc"></div>
 <div style="grid-column:1/-1"><label>Address</label><input id="r_addr"></div>
 <div style="grid-column:1/-1"><label>Program</label><select id="r_prog"><option value="">Select program…</option>${Object.keys(PROGRAMS).map(p=>`<option>${esc(p)}</option>`).join("")}</select></div></div>
 <button class="btn" onclick="register()">Register student</button><div id="rmsg"></div></div>`}
async function register(){
 const v=k=>$("#r_"+k).value.trim(),m=$("#rmsg");
 if(!v("name")||!v("email")||!v("phone")||!v("dtc")||!v("addr")||!v("prog")){m.innerHTML=`<div class="err">Please fill in every field.</div>`;return}
 const P=PROGRAMS[v("prog")],assessments=[];
 Object.entries(P.courses).forEach(([c,as])=>as.forEach(a=>assessments.push({course:c,name:a,score:"",max:100,grade:"",status:"Pending"})));
 const s={id:uid(),partnerUid:user.uid,partnerEmail:user.email,name:v("name"),email:v("email"),phone:v("phone"),dtcId:v("dtc"),address:v("addr"),program:v("prog"),status:"Submitted",start:"",end:"",assessments,created:new Date().toISOString()};
 try{await store.add("students",s);tab="mine";await render();}catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function mineView(S){return`<div class="card"><h2>My registrations</h2>${S.length?`<div class="wrap"><table><tr><th>Student</th><th>DTC ID</th><th>Program</th><th>Registered</th><th>Status</th></tr>${S.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="mut">${esc(s.email)}</span></td><td>${esc(s.dtcId)}</td><td>${esc(s.program)}</td><td>${esc((s.created||"").slice(0,10))}</td><td>${badge(s.status)}${stepper(s.status)}</td></tr>`).join("")}</table></div>`:`<p class="mut">No students registered yet.</p>`}</div>`}
function progressView(S){
 if(!S.length)return`<div class="card"><h2>Student progress</h2><p class="mut">Register a student first.</p></div>`;
 return`<div class="card"><h2>Student progress</h2><label>Select student</label><select onchange="showProg(this.value)"><option value="">Choose…</option>${S.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} – ${esc(s.dtcId)}</option>`).join("")}</select></div><div id="pg"></div>`}
function showProg(id){
 const s=_s.find(x=>x.id==id);if(!s){$("#pg").innerHTML="";return}
 const by={};(s.assessments||[]).forEach(a=>(by[a.course]=by[a.course]||[]).push(a));const p=progress(s);
 $("#pg").innerHTML=`<div class="card"><h3>${esc(s.name)} · ${esc(s.program)}</h3>${badge(s.status)}
 <p class="mut">Start date: <b>${esc(s.start||"Not set yet")}</b> &nbsp; End date: <b>${esc(s.end||"Not set yet")}</b></p>
 <div class="bar"><i style="width:${p}%"></i></div><p class="mut">${p}% of assessments graded</p>
 ${Object.entries(by).map(([c,a])=>`<h3 style="margin-top:16px">${esc(c)}</h3><div class="wrap"><table><tr><th>Assessment</th><th>Score</th><th>Grade</th><th>Status</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.score===""?"–":esc(x.score)+" / "+esc(x.max)}</td><td>${esc(x.grade||"–")}</td><td>${badge(x.status)}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
}
function swapView(S,W){return`<div class="card"><h2>Request a student swap</h2><p class="mut">Replace a registered student with a different person.</p>
 <label>Student to replace</label><select id="w_s"><option value="">Choose…</option>${S.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} – ${esc(s.dtcId)}</option>`).join("")}</select>
 <div class="grid"><div><label>New student name</label><input id="w_n"></div><div><label>New student email</label><input id="w_e" type="email"></div>
 <div><label>New student phone</label><input id="w_p"></div><div><label>New DTC ID</label><input id="w_d"></div></div>
 <label>Reason</label><textarea id="w_r" rows="3"></textarea><button class="btn" onclick="swap()">Submit swap request</button><div id="wmsg"></div></div>
 <div class="card"><h3>My swap requests</h3>${W.length?`<div class="wrap"><table><tr><th>Current</th><th>Replace with</th><th>Reason</th><th>Status</th></tr>${W.map(w=>`<tr><td>${esc(w.studentName)}</td><td>${esc(w.newName)}<br><span class="mut">${esc(w.newDtc)}</span></td><td>${esc(w.reason)}</td><td>${badge(w.status)}${w.note?`<br><span class="mut">${esc(w.note)}</span>`:""}</td></tr>`).join("")}</table></div>`:`<p class="mut">None yet.</p>`}</div>`}
async function swap(){
 const g=k=>$("#w_"+k).value.trim(),s=_s.find(x=>x.id==g("s"));
 if(!s||!g("n")||!g("e")||!g("d")||!g("r")){$("#wmsg").innerHTML=`<div class="err">Please complete all fields.</div>`;return}
 await store.add("swaps",{id:uid(),partnerUid:user.uid,partnerEmail:user.email,studentId:s.id,studentName:s.name,newName:g("n"),newEmail:g("e"),newPhone:g("p"),newDtc:g("d"),reason:g("r"),status:"Pending",note:"",created:new Date().toISOString()});
 render();
}

/* ---------- Admin ---------- */
function adminStudents(S){return`<div class="card"><h2>All registered students</h2><input placeholder="Search name, DTC ID, partner…" oninput="filt(this.value)" style="max-width:340px;margin-bottom:12px">
 <div class="wrap"><table id="tb"><tr><th>Student</th><th>DTC ID</th><th>Program</th><th>Partner</th><th>Status</th><th>Progress</th><th></th></tr>${S.map(s=>`<tr data-q="${esc((s.name+s.dtcId+s.partnerEmail+s.program).toLowerCase())}"><td><b>${esc(s.name)}</b><br><span class="mut">${esc(s.email)}</span></td><td>${esc(s.dtcId)}</td><td>${esc(s.program)}</td><td>${esc(s.partnerEmail)}</td><td>${badge(s.status)}</td><td>${progress(s)}%</td><td><button class="btn sm dark" onclick="edit('${esc(s.id)}')">Edit</button></td></tr>`).join("")}</table></div></div>`}
function filt(q){q=q.toLowerCase();document.querySelectorAll("#tb tr[data-q]").forEach(r=>r.style.display=r.dataset.q.includes(q)?"":"none")}
function edit(id){
 const s=_s.find(x=>x.id==id),f=(k,l,t="text")=>`<div><label>${l}</label><input id="e_${k}" type="${t}" value="${esc(s[k])}"></div>`;
 const m=document.createElement("div");m.className="modal";m.id="md";
 m.innerHTML=`<div class="card"><h2>Edit – ${esc(s.name)}</h2><div class="grid">${f("name","Name")}${f("email","Email")}${f("phone","Phone")}${f("dtcId","DTC ID")}${f("address","Address")}
 <div><label>Program</label><select id="e_program">${Object.keys(PROGRAMS).map(p=>`<option ${p==s.program?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
 <div><label>Status</label><select id="e_status">${STATUSES.map(x=>`<option ${x==s.status?"selected":""}>${x}</option>`).join("")}</select></div><div></div>
 ${f("start","Start date","date")}${f("end","End date","date")}</div>
 <h3 style="margin-top:18px">Assessments & grades</h3><div class="wrap"><table><tr><th>Course</th><th>Assessment</th><th>Score</th><th>Max</th><th>Grade</th><th>Status</th></tr>
 ${(s.assessments||[]).map((a,i)=>`<tr><td>${esc(a.course)}</td><td>${esc(a.name)}</td><td><input id="a_s${i}" type="number" value="${esc(a.score)}" style="width:80px" oninput="autoG(${i})"></td><td><input id="a_m${i}" type="number" value="${esc(a.max)}" style="width:70px" oninput="autoG(${i})"></td><td><input id="a_g${i}" value="${esc(a.grade)}" style="width:60px"></td>
 <td><select id="a_t${i}">${["Pending","Passed","Failed"].map(x=>`<option ${x==a.status?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</table></div>
 <button class="btn" onclick="saveS('${esc(s.id)}')">Save changes</button> <button class="btn ghost" onclick="$('#md').remove()">Cancel</button></div>`;
 document.body.appendChild(m);
}
function autoG(i){const s=$("#a_s"+i).value,m=+$("#a_m"+i).value||100;$("#a_g"+i).value=grade(s===""?"":+s,m);if(s!=="")$("#a_t"+i).value=(+s/m>=.4)?"Passed":"Failed"}
async function saveS(id){
 const s=_s.find(x=>x.id==id),v=k=>$("#e_"+k).value.trim();
 const as=(s.assessments||[]).map((a,i)=>({...a,score:$("#a_s"+i).value===""?"":+$("#a_s"+i).value,max:+$("#a_m"+i).value||100,grade:$("#a_g"+i).value,status:$("#a_t"+i).value}));
 await store.upd("students",id,{name:v("name"),email:v("email"),phone:v("phone"),dtcId:v("dtcId"),address:v("address"),program:v("program"),status:v("status"),start:v("start"),end:v("end"),assessments:as});
 $("#md").remove();render();
}
function adminSwaps(W){return`<div class="card"><h2>Swap requests</h2>${W.length?`<div class="wrap"><table><tr><th>Partner</th><th>Current student</th><th>Replace with</th><th>Reason</th><th>Status</th><th></th></tr>${W.map(w=>`<tr><td>${esc(w.partnerEmail)}</td><td>${esc(w.studentName)}</td><td>${esc(w.newName)}<br><span class="mut">${esc(w.newEmail)} · ${esc(w.newDtc)}</span></td><td>${esc(w.reason)}</td><td>${badge(w.status)}</td>
 <td>${w.status=="Pending"?`<button class="btn sm" onclick="decide('${esc(w.id)}',true)">Approve</button> <button class="btn sm ghost" onclick="decide('${esc(w.id)}',false)">Reject</button>`:""}</td></tr>`).join("")}</table></div>`:`<p class="mut">No requests.</p>`}</div>`}
async function decide(id,ok){
 const w=_w.find(x=>x.id==id),note=prompt(ok?"Note for partner (optional):":"Reason for rejection:")||"";
 if(ok)await store.upd("students",w.studentId,{name:w.newName,email:w.newEmail,phone:w.newPhone||"",dtcId:w.newDtc});
 await store.upd("swaps",id,{status:ok?"Approved":"Rejected",note});render();
}
loginView();
</script></body></html>
